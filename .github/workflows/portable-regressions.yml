name: Portable source and geometry regressions
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-kernel-reference.txt
      - name: Python kernel dependencies
        run: python -m pip install -r requirements-kernel-reference.txt
      - name: Source, kernel-reference, audit-contract tests
        run: python -m unittest discover -s tests -p '*.py' -q
      - name: C++ portable regression executables
        run: python tools/run_portable_regressions.py --compiler g++ --jobs 3
      - name: Independent Clang C++ portable regression compilation
        run: python tools/run_portable_regressions.py --compiler clang++ --jobs 3
      - name: Audit entire source tree and portable registration
        run: python tools/audit_full_source.py
      - name: Verify CTest registration count is unchanged
        run: python tools/verify_130_tests.py

# This is NOT a native Windows/Qt/OpenCascade full-build workflow.
# Windows developers must run RUN_V170_COMPREHENSIVE_AUDIT.ps1 and record
# GUI acceptance separately. A green CI badge is not release authorization.
